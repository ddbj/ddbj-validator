[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddbj-validator"
version = "0.5.3-beta"
description = "Validation tools for DDBJ, BioProject, BioSample etc."
dependencies = [
    "biopython",
    "psycopg2-binary",
    "python-dateutil",
    "python-dotenv",
    "requests",
    "intervaltree",
    "defusedxml",
    "geopandas",
    "pyarrow",
    "shapely",
    "lxml"
]

[project.optional-dependencies]
# Web API（FastAPI）用。validator 本体には不要なので extra に分離。
# インストール: pip install .[web]
web = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
# main.py の multiplexer を指す（ddbj / biosample サブコマンドを振り分ける）。
# 第1引数が既知サブコマンドでなければ暗黙的に ddbj を補完するため後方互換
# （`ddbj-validator <dir>` は従来どおり ddbj 検証）。biosample は
# `ddbj-validator biosample ...` で実行できる（docker ENTRYPOINT も同じ）。
ddbj-validator = "main:main"

[tool.setuptools]
# ルートにある main.py を単独モジュールとして認識させる
py-modules = ["main"]

[tool.setuptools.packages.find]
# config や geo を除外し、Pythonパッケージとして認識させるディレクトリを限定する
include = ["common*", "apps*"]

# Python以外のリソースファイルをパッケージに同梱
[tool.setuptools.package-data]
"apps.ddbj.resources" = ["*.json"]
"apps.biosample.resources" = ["*.json", "xsd/*.xsd"]
"apps.bioproject.resources" = ["*.json", "xsd/*.xsd"]
"apps.dra.resources" = ["*.json", "xsd/*.xsd"]
"apps.metabobank.resources" = ["*.json"]
"apps.gea.resources" = ["*.json"]
"apps.webapi.resources" = ["*.xml"]
"common.resources" = ["*.txt", "*.json"]
"common.resources.geo" = ["*.parquet", "*.json"]

# ユニットテスト（純関数の挙動固定）。E2E ハーネス（apps/ddbj/tests）とは別物。
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]