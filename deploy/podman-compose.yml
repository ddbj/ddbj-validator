# DDBJ validator Web API（podman compose）。docker は不可（root デーモン・セキュリティ）。
# 起動: podman compose --env-file .env up -d --build
#   a011（本番） / a012（ステージング）で同一ファイル、.env のみ差し替え。
#
# web と validator は別サービス。共有ボリューム DATA_DIR を両者でマウントする。
# 既定では web が自コンテナ内の validator を子プロセス起動する（DDBJ_VALIDATOR_CMD 未設定）。
# validator を完全に別コンテナで実行する場合は web の DDBJ_VALIDATOR_CMD を
#   "podman exec ddbj-validator ddbj-validator"
# のように設定し、validator サービスを常駐させる。
version: "3"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Containerfile.web
    image: ddbj-validator-web:${DDBJ_ENV:-development}
    environment:
      DDBJ_ENV: ${DDBJ_ENV:-development}
      DDBJ_DATA_DIR: /data
      DDBJ_DEFAULT_MODE: ${DDBJ_DEFAULT_MODE:-db}
      # 別コンテナ validator を使う場合のみ設定（未設定なら web 内で子プロセス実行）
      DDBJ_VALIDATOR_CMD: ${DDBJ_VALIDATOR_CMD:-}
    env_file:
      - .env
    ports:
      - "${DDBJ_WEB_PORT:-8000}:8000"
    volumes:
      - ${DDBJ_DATA_DIR_HOST:-./data}:/data:z

  # validator を別コンテナ常駐させたい場合に有効化（web の DDBJ_VALIDATOR_CMD と対で使う）。
  validator:
    build:
      context: ..
      dockerfile: deploy/Containerfile.validator
    image: ddbj-validator:${DDBJ_ENV:-development}
    env_file:
      - .env
    volumes:
      - ${DDBJ_DATA_DIR_HOST:-./data}:/data:z
    # 常駐用（web から podman exec で呼ぶ運用時）。単一コンテナ運用なら不要。
    entrypoint: ["sleep", "infinity"]
    profiles: ["separate-validator"]
